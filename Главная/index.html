<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Мои лекции</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1e1e2e;
            color: #cdd6f4;
            margin: 0;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 300px;
            background: #181825;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #313244;
        }
        .content {
            flex: 1;
            padding: 20px;
        }
        .folder {
            margin: 10px 0;
        }
        .folder-name {
            font-weight: bold;
            color: #89b4fa;
            cursor: pointer;
            margin: 5px 0;
        }
        .file-list, .subfolder-list {
            list-style: none;
            padding-left: 20px;
            margin: 5px 0;
            display: none;
        }
        .file-list.show, .subfolder-list.show {
            display: block;
        }
        .file-list li, .subfolder-list li {
            margin: 5px 0;
        }
        .file-list a {
            color: #a6e3a1;
            text-decoration: none;
        }
        .file-list a:hover {
            text-decoration: underline;
        }
        iframe {
            width: 100%;
            height: 90vh;
            border: none;
            background: white;
            border-radius: 10px;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
<div class="sidebar">
    <h3>📚 Лекции</h3>
    <div id="tree"></div>
</div>
<div class="content">
    <div id="viewer" class="loading">Выберите файл слева</div>
</div>

<script>
    // Функция для получения списка файлов и папок через GitHub API
    async function getRepoContents(path = '') {
        const repo = 'natutif-max/Lectures228';
        const url = `https://api.github.com/repos/${repo}/contents/${path}`;
        const response = await fetch(url);
        const data = await response.json();
        return data;
    }

    // Функция для построения дерева
    async function buildTree() {
        const container = document.getElementById('tree');
        container.innerHTML = 'Загрузка...';
        
        try {
            const items = await getRepoContents('');
            const folders = items.filter(item => item.type === 'dir');
            const files = items.filter(item => item.type === 'file' && item.name.endsWith('.html'));
            
            container.innerHTML = '';
            
            // Папки
            for (const folder of folders) {
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder';
                
                const folderName = document.createElement('div');
                folderName.className = 'folder-name';
                folderName.textContent = `📁  ${folder.name}`;
                folderName.onclick = () => {
                    const fileList = folderDiv.querySelector('.file-list');
                    fileList.classList.toggle('show');
                };
                
                const fileList = document.createElement('ul');
                fileList.className = 'file-list';
                
                const subItems = await getRepoContents(folder.path);
                const subFiles = subItems.filter(item => item.type === 'file' && item.name.endsWith('.html'));
                
                for (const file of subFiles) {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#';
                    a.textContent = file.name.replace('.html', '');
                    a.onclick = () => {
                        document.getElementById('viewer').innerHTML = `<iframe src="${file.download_url}"></iframe>`;
                    };
li.appendChild(a);
                    fileList.appendChild(li);
                }
                
                folderDiv.appendChild(folderName);
                folderDiv.appendChild(fileList);
                container.appendChild(folderDiv);
            }
            
            // Файлы в корне
            if (files.length > 0) {
                const rootFiles = document.createElement('div');
                rootFiles.innerHTML = '<div style="margin-top: 15px;"><strong>Файлы в корне:</strong></div>';
                const rootList = document.createElement('ul');
                rootList.className = 'file-list show';
                for (const file of files) {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#';
                    a.textContent = file.name.replace('.html', '');
                    a.onclick = () => {
                        document.getElementById('viewer').innerHTML = `<iframe src="${file.download_url}"></iframe>`;
                    };
                    li.appendChild(a);
                    rootList.appendChild(li);
                }
                rootFiles.appendChild(rootList);
                container.appendChild(rootFiles);
            }
            
        } catch (e) {
            container.innerHTML = 'Ошибка загрузки. Убедитесь, что репозиторий публичный.';
            console.error(e);
        }
    }
    
    buildTree();
</script>
</body>
</html>
